securitySchemes:
  CookieAuth:
    type: apiKey
    in: cookie
    name: jwt
  ApiKeyAuth:
    type: apiKey
    in: header
    name: X-API-Key
  InternalUsageTokenAuth:
    type: apiKey
    in: header
    name: X-Internal-Usage-Token
    description: Internal token required to ingest usage events.
parameters:
  XOrgId:
    name: X-Org-Id
    in: header
    required: false
    schema:
      type: string
      pattern: "^[a-f\\d]{24}$"
    description: Optional organization id to select tenant context.
  XCsrfToken:
    name: X-CSRF-Token
    in: header
    required: false
    schema:
      type: string
    description: Required for state-changing requests when CSRF is enabled.
  OrgIdPath:
    name: orgId
    in: path
    required: true
    schema:
      type: string
      pattern: "^[a-f\\d]{24}$"
  WorkflowIdPath:
    name: id
    in: path
    required: true
    schema:
      type: string
      pattern: "^[a-f\\d]{24}$"
  ObjectIdPath:
    name: id
    in: path
    required: true
    schema:
      type: string
      pattern: "^[a-f\\d]{24}$"
  GoalIdPath:
    name: goalId
    in: path
    required: true
    schema:
      type: string
      pattern: "^[a-f\\d]{24}$"
  DebtIdPath:
    name: debtId
    in: path
    required: true
    schema:
      type: string
      pattern: "^[a-f\\d]{24}$"
  SessionIdPath:
    name: sessionId
    in: path
    required: true
    schema:
      type: string
      pattern: "^[a-f\\d]{24}$"
  FileIdPath:
    name: fileId
    in: path
    required: true
    schema:
      type: string
      pattern: "^[a-f\\d]{24}$"
  UserIdPath:
    name: userId
    in: path
    required: true
    schema:
      type: string
      pattern: "^[a-f\\d]{24}$"
responses:
  BadRequest:
    description: Bad request
    content:
      application/json:
        schema:
          $ref: "#/schemas/ErrorResponse"
  Unauthorized:
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: "#/schemas/ErrorResponse"
  PaymentRequired:
    description: Payment required
    content:
      application/json:
        schema:
          $ref: "#/schemas/ErrorResponse"
  Forbidden:
    description: Forbidden
    content:
      application/json:
        schema:
          $ref: "#/schemas/ErrorResponse"
  NotFound:
    description: Not found
    content:
      application/json:
        schema:
          $ref: "#/schemas/ErrorResponse"
  Conflict:
    description: Conflict
    content:
      application/json:
        schema:
          $ref: "#/schemas/ErrorResponse"
schemas:
  ErrorResponse:
    type: object
    additionalProperties: true
    properties:
      message:
        type: string
      code:
        type: string
      details:
        description: Optional error details (shape is endpoint-specific).
        anyOf:
          - type: object
            additionalProperties: true
          - type: array
            items: {}
          - type: string
          - type: number
          - type: boolean
          - type: "null"
      request_id:
        type: string
    required: [message, code, request_id]
  Pagination:
    type: object
    additionalProperties: false
    properties:
      page:
        type: integer
        minimum: 1
      limit:
        type: integer
        minimum: 1
      total:
        type: integer
        minimum: 0
      totalPages:
        type: integer
        minimum: 0
    required: [page, limit, total, totalPages]
  LooseSuccessResponse:
    type: object
    additionalProperties: true
    properties:
      request_id:
        type: string
      org_id:
        type: string
    required: [request_id]
  PaginatedLooseSuccessResponse:
    allOf:
      - $ref: "#/schemas/LooseSuccessResponse"
      - type: object
        additionalProperties: true
        properties:
          pagination:
            $ref: "#/schemas/Pagination"
        required: [pagination]
  OrgRole:
    type: string
    enum: [owner, admin, member]
  OrgMemberStatus:
    type: string
    enum: [active, invited, removed]
  OrgInviteStatus:
    type: string
    enum: [pending, accepted, revoked, expired]
  OrgMember:
    type: object
    additionalProperties: false
    properties:
      id: { type: string }
      user_id: { type: string }
      role: { $ref: "#/schemas/OrgRole" }
      status: { $ref: "#/schemas/OrgMemberStatus" }
    required: [id, user_id, role, status]
  OrgInviteCreated:
    type: object
    additionalProperties: false
    properties:
      id: { type: string }
      email: { type: string, format: email }
      role: { $ref: "#/schemas/OrgRole" }
      status: { $ref: "#/schemas/OrgInviteStatus" }
      expires_at: { type: string, format: date-time }
      token_prefix: { type: string }
      token: { type: string }
    required: [id, email, role, status, expires_at, token_prefix]
  OrgInviteAccepted:
    type: object
    additionalProperties: false
    properties:
      id: { type: string }
      org_id: { type: string }
      email: { type: string, format: email }
      role: { $ref: "#/schemas/OrgRole" }
      status: { $ref: "#/schemas/OrgInviteStatus" }
      accepted_at: { type: string, format: date-time }
    required: [id, org_id, email, role, status]
  OrgsMeResponse:
    type: object
    additionalProperties: false
    properties:
      active_org:
        anyOf:
          - type: "null"
          - type: object
            additionalProperties: false
            properties:
              id: { type: string }
              role: { $ref: "#/schemas/OrgRole" }
              member_id: { type: string }
            required: [id, role, member_id]
      orgs:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            id: { type: string }
            name: { type: string }
            slug: { type: string }
            type: { type: string, enum: [personal, team] }
            currency: { type: string }
            locale: { type: string }
            timezone: { type: string }
            role: { $ref: "#/schemas/OrgRole" }
            is_default: { type: boolean }
          required: [id, name, slug, type, currency, locale, timezone, role, is_default]
      request_id:
        type: string
    required: [active_org, orgs, request_id]
  CreateOrgRequest:
    type: object
    additionalProperties: false
    properties:
      name:
        type: string
        minLength: 2
        maxLength: 120
      slug:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{1,78}[a-z0-9]$"
    required: [name]
  CreateOrgResponse:
    type: object
    additionalProperties: false
    properties:
      org:
        type: object
        additionalProperties: false
        properties:
          id: { type: string }
          slug: { type: string }
          name: { type: string }
          type: { type: string, enum: [team] }
          currency: { type: string }
          locale: { type: string }
          timezone: { type: string }
          role: { $ref: "#/schemas/OrgRole" }
        required: [id, slug, name, type, currency, locale, timezone, role]
      request_id:
        type: string
    required: [org, request_id]
  AddOrgMemberRequest:
    type: object
    additionalProperties: false
    properties:
      email:
        type: string
        format: email
        maxLength: 200
      role:
        $ref: "#/schemas/OrgRole"
    required: [email]
  AddOrgMemberResponse:
    type: object
    additionalProperties: false
    properties:
      org:
        type: object
        additionalProperties: false
        properties:
          id: { type: string }
          name: { type: string }
          slug: { type: string }
        required: [id, name, slug]
      member:
        anyOf:
          - type: "null"
          - $ref: "#/schemas/OrgMember"
      invite:
        anyOf:
          - type: "null"
          - $ref: "#/schemas/OrgInviteCreated"
      request_id:
        type: string
    required: [org, member, invite, request_id]
  UpdateOrgSettingsRequest:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      currency:
        type: string
        pattern: "^[A-Z]{3}$"
      locale:
        type: string
        minLength: 2
        maxLength: 50
      timezone:
        type: string
        minLength: 1
        maxLength: 80
  UpdateOrgSettingsResponse:
    type: object
    additionalProperties: false
    properties:
      org:
        type: object
        additionalProperties: false
        properties:
          id: { type: string }
          name: { type: string }
          slug: { type: string }
          type: { type: string, enum: [personal, team] }
          currency: { type: string }
          locale: { type: string }
          timezone: { type: string }
        required: [id, name, slug, type, currency, locale, timezone]
      request_id: { type: string }
    required: [org, request_id]
  AcceptOrgInviteRequest:
    type: object
    additionalProperties: false
    properties:
      token:
        type: string
        minLength: 20
        maxLength: 256
    required: [token]
  AcceptOrgInviteResponse:
    type: object
    additionalProperties: false
    properties:
      invite:
        $ref: "#/schemas/OrgInviteAccepted"
      member:
        anyOf:
          - type: "null"
          - type: object
            additionalProperties: false
            properties:
              id: { type: string }
              org_id: { type: string }
              user_id: { type: string }
              role: { $ref: "#/schemas/OrgRole" }
              status: { $ref: "#/schemas/OrgMemberStatus" }
            required: [id, org_id, user_id, role, status]
      request_id: { type: string }
    required: [invite, member, request_id]
  ExportJobStatus:
    type: string
    enum: [queued, running, succeeded, failed]
  ExportJobType:
    type: string
    enum: [transactions_csv, monthly_summary_pdf]
  TransactionType:
    type: string
    enum: [income, expense, investment]
  TransactionsCsvExportParams:
    type: object
    additionalProperties: false
    properties:
      date_from:
        type: string
        minLength: 8
        maxLength: 40
        description: ISO date or datetime string.
      date_to:
        type: string
        minLength: 8
        maxLength: 40
        description: ISO date or datetime string.
      tx_type:
        $ref: "#/schemas/TransactionType"
      category:
        type: string
        maxLength: 100
  MonthlySummaryPdfExportParams:
    type: object
    additionalProperties: false
    properties:
      period_key:
        type: string
        pattern: "^\\d{4}-\\d{2}$"
    required: [period_key]
  CreateTransactionsCsvExportRequest:
    type: object
    additionalProperties: false
    properties:
      type:
        type: string
        enum: [transactions_csv]
      params:
        $ref: "#/schemas/TransactionsCsvExportParams"
      idempotency_key:
        type: string
        minLength: 8
        maxLength: 128
    required: [type]
  CreateMonthlySummaryPdfExportRequest:
    type: object
    additionalProperties: false
    properties:
      type:
        type: string
        enum: [monthly_summary_pdf]
      params:
        $ref: "#/schemas/MonthlySummaryPdfExportParams"
      idempotency_key:
        type: string
        minLength: 8
        maxLength: 128
    required: [type, params]
  CreateExportRequest:
    anyOf:
      - $ref: "#/schemas/CreateTransactionsCsvExportRequest"
      - $ref: "#/schemas/CreateMonthlySummaryPdfExportRequest"
  ExportJob:
    type: object
    additionalProperties: false
    properties:
      id: { type: string }
      type: { $ref: "#/schemas/ExportJobType" }
      status: { $ref: "#/schemas/ExportJobStatus" }
      params:
        type: object
        additionalProperties: true
      filename: { type: string }
      content_type: { type: string }
      bytes: { type: integer }
      started_at: { type: string, format: date-time }
      finished_at: { type: string, format: date-time }
      error: { type: string }
      created_at: { type: string, format: date-time }
      updated_at: { type: string, format: date-time }
    required: [id, type, status, params]
  ListExportsResponse:
    type: object
    additionalProperties: false
    properties:
      exports:
        type: array
        items:
          $ref: "#/schemas/ExportJob"
      request_id: { type: string }
    required: [exports, request_id]
  GetExportResponse:
    type: object
    additionalProperties: false
    properties:
      export:
        $ref: "#/schemas/ExportJob"
      request_id: { type: string }
    required: [export, request_id]
  CreateExportResponse:
    type: object
    additionalProperties: false
    properties:
      export:
        $ref: "#/schemas/ExportJob"
      queued: { type: boolean }
      request_id: { type: string }
    required: [export, queued, request_id]
  AuditActorType:
    type: string
    enum: [user, system, api_key]
  AuditEvent:
    type: object
    additionalProperties: false
    properties:
      id: { type: string }
      actor_type: { $ref: "#/schemas/AuditActorType" }
      actor_user_id: { type: string }
      actor_api_key_id: { type: string }
      action: { type: string }
      target_type: { type: string }
      target_id: { type: string }
      request_id: { type: string }
      metadata:
        type: object
        additionalProperties: true
      created_at: { type: string, format: date-time }
    required: [id, actor_type, action, target_type, metadata, created_at]
  AuditEventsResponse:
    type: object
    additionalProperties: false
    properties:
      events:
        type: array
        items:
          $ref: "#/schemas/AuditEvent"
      request_id: { type: string }
    required: [events, request_id]
  EntitlementStatus:
    type: string
    enum: [active, trialing, past_due, canceled]
  EntitlementSnapshot:
    type: object
    additionalProperties: false
    properties:
      plan: { $ref: "#/schemas/PlanTier" }
      status: { $ref: "#/schemas/EntitlementStatus" }
      base_limits: { $ref: "#/schemas/PlanLimit" }
      credits: { $ref: "#/schemas/EntitlementCredits" }
      limits: { $ref: "#/schemas/PlanLimit" }
      usage:
        type: object
        additionalProperties: false
        properties:
          monthly_ai_calls: { type: integer }
          scenario_depth: { type: integer }
          ocr_quota: { type: integer }
          export_access: { type: integer }
          api_requests: { type: integer }
          workflow_runs: { type: integer }
          connector_sync_records: { type: integer }
          marketplace_installs: { type: integer }
        required:
          [
            monthly_ai_calls,
            scenario_depth,
            ocr_quota,
            export_access,
            api_requests,
            workflow_runs,
            connector_sync_records,
            marketplace_installs,
          ]
      remaining: { $ref: "#/schemas/PlanLimit" }
      period_key: { type: string }
    required: [plan, status, base_limits, credits, limits, usage, remaining, period_key]
  EntitlementsMeResponse:
    type: object
    additionalProperties: false
    properties:
      org_id: { type: string }
      plan: { $ref: "#/schemas/PlanTier" }
      status: { $ref: "#/schemas/EntitlementStatus" }
      base_limits: { $ref: "#/schemas/PlanLimit" }
      credits: { $ref: "#/schemas/EntitlementCredits" }
      limits: { $ref: "#/schemas/PlanLimit" }
      usage:
        type: object
        additionalProperties: false
        properties:
          monthly_ai_calls: { type: integer }
          scenario_depth: { type: integer }
          ocr_quota: { type: integer }
          export_access: { type: integer }
          api_requests: { type: integer }
          workflow_runs: { type: integer }
          connector_sync_records: { type: integer }
          marketplace_installs: { type: integer }
        required:
          [
            monthly_ai_calls,
            scenario_depth,
            ocr_quota,
            export_access,
            api_requests,
            workflow_runs,
            connector_sync_records,
            marketplace_installs,
          ]
      remaining: { $ref: "#/schemas/PlanLimit" }
      period_key: { type: string }
      request_id: { type: string }
    required: [plan, status, base_limits, credits, limits, usage, remaining, period_key, request_id]
  AppConfigResponse:
    type: object
    additionalProperties: false
    properties:
      org:
        anyOf:
          - type: "null"
          - type: object
            additionalProperties: false
            properties:
              id: { type: string }
              role: { $ref: "#/schemas/OrgRole" }
              member_id: { type: string }
              name: { type: string }
              slug: { type: string }
              type: { type: string, enum: [personal, team] }
              currency: { type: string }
              locale: { type: string }
              timezone: { type: string }
            required: [id, role, member_id]
      features:
        type: object
        additionalProperties: false
        properties:
          tasks_enabled: { type: boolean }
          receipts_ocr_enabled: { type: boolean }
          journal_enabled: { type: boolean }
          monetization_enabled: { type: boolean }
          csrf_enabled: { type: boolean }
          google_oauth_enabled: { type: boolean }
        required:
          - tasks_enabled
          - receipts_ocr_enabled
          - journal_enabled
          - monetization_enabled
          - csrf_enabled
          - google_oauth_enabled
      entitlements:
        anyOf:
          - type: "null"
          - $ref: "#/schemas/EntitlementSnapshot"
      request_id: { type: string }
    required: [org, features, entitlements, request_id]
  PlanCatalogEntry:
    type: object
    additionalProperties: false
    properties:
      id: { type: string }
      label: { type: string }
      limits: { $ref: "#/schemas/PlanLimit" }
    required: [id, label, limits]
  PlansResponse:
    type: object
    additionalProperties: false
    properties:
      plans:
        type: array
        items:
          $ref: "#/schemas/PlanCatalogEntry"
      request_id: { type: string }
    required: [plans, request_id]
  UsageEventRequest:
    type: object
    additionalProperties: false
    properties:
      org_id: { type: string, pattern: "^[A-Fa-f\\d]{24}$" }
      user_id: { type: string, pattern: "^[A-Fa-f\\d]{24}$" }
      feature: { $ref: "#/schemas/UsageFeature" }
      units: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
      idempotency_key: { type: string, minLength: 8, maxLength: 128 }
      context:
        type: object
        additionalProperties: true
    required: [user_id, feature, units]
  UsageEventIngestResponse:
    type: object
    additionalProperties: false
    properties:
      accepted: { type: boolean }
      request_id: { type: string }
    required: [accepted, request_id]
  MarketplaceInstallRequest:
    type: object
    additionalProperties: false
    properties:
      plugin_key:
        type: string
        pattern: "^[a-z0-9][a-z0-9._:-]{1,118}[a-z0-9]$"
      version:
        type: string
        minLength: 1
        maxLength: 40
      permissions:
        type: array
        maxItems: 100
        items:
          type: string
          minLength: 1
          maxLength: 120
    required: [plugin_key]
  PluginVersionUpdateRequest:
    type: object
    additionalProperties: false
    properties:
      version:
        type: string
        minLength: 1
        maxLength: 40
    required: [version]
  FeatureFlagUpsertRequest:
    type: object
    additionalProperties: false
    properties:
      enabled: { type: boolean }
      variant:
        type: string
        minLength: 1
        maxLength: 80
      rollout_percent:
        type: integer
        minimum: 0
        maximum: 100
      metadata:
        type: object
        additionalProperties: true
    required: [enabled]
  FeatureFlagRow:
    type: object
    additionalProperties: false
    properties:
      key: { type: string }
      enabled: { type: boolean }
      variant:
        anyOf:
          - type: "null"
          - type: string
      rollout_percent: { type: integer }
      metadata:
        type: object
        additionalProperties: true
      updated_at:
        anyOf:
          - type: "null"
          - type: string
            format: date-time
    required: [key, enabled, variant, rollout_percent, metadata, updated_at]
  IntegrationSyncRequest:
    type: object
    additionalProperties: false
    properties:
      records_synced:
        type: integer
        minimum: 0
        maximum: 1000000
      simulate_error: { type: boolean }
  AutomationEventEmitRequest:
    type: object
    additionalProperties: false
    properties:
      event_type:
        type: string
        minLength: 2
        maxLength: 120
      aggregate_type:
        type: string
        minLength: 2
        maxLength: 120
      aggregate_id:
        type: string
        minLength: 2
        maxLength: 200
      payload:
        type: object
        additionalProperties: true
    required: [event_type]
  MarketplaceCatalogResponse:
    type: object
    additionalProperties: false
    properties:
      org_id: { type: string }
      plugins:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            plugin_key: { type: string }
            name: { type: string }
            description: { type: string }
            publisher: { type: string }
            status: { type: string, enum: [active, preview, deprecated] }
            latest_version: { type: string }
            available_versions:
              type: array
              items: { type: string }
            permissions:
              type: array
              items: { type: string }
            pricing_model: { type: string, enum: [free, paid] }
            price_monthly_usd:
              anyOf:
                - type: "null"
                - type: number
            installed: { type: boolean }
            installed_version:
              anyOf:
                - type: "null"
                - type: string
            installed_status:
              anyOf:
                - type: "null"
                - type: string
            installed_updated_at:
              anyOf:
                - type: "null"
                - type: string
                  format: date-time
          required:
            [
              plugin_key,
              name,
              description,
              publisher,
              status,
              latest_version,
              available_versions,
              permissions,
              pricing_model,
              price_monthly_usd,
              installed,
              installed_version,
              installed_status,
              installed_updated_at,
            ]
      request_id: { type: string }
    required: [org_id, plugins, request_id]
  MarketplaceInstallResponse:
    type: object
    additionalProperties: false
    properties:
      org_id: { type: string }
      install:
        type: object
        additionalProperties: false
        properties:
          plugin_key: { type: string }
          version: { type: string }
          status: { type: string }
          permissions:
            type: array
            items: { type: string }
          created_at:
            anyOf:
              - type: "null"
              - type: string
                format: date-time
          updated_at:
            anyOf:
              - type: "null"
              - type: string
                format: date-time
        required: [plugin_key, version, status, permissions, created_at, updated_at]
      request_id: { type: string }
    required: [org_id, install, request_id]
  PluginsListResponse:
    type: object
    additionalProperties: false
    properties:
      org_id: { type: string }
      plugins:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            plugin_key: { type: string }
            name: { type: string }
            publisher: { type: string }
            version: { type: string }
            status: { type: string }
            permissions:
              type: array
              items: { type: string }
            created_at:
              anyOf:
                - type: "null"
                - type: string
                  format: date-time
            updated_at:
              anyOf:
                - type: "null"
                - type: string
                  format: date-time
          required: [plugin_key, name, publisher, version, status, permissions, created_at, updated_at]
      request_id: { type: string }
    required: [org_id, plugins, request_id]
  PluginOperationResponse:
    type: object
    additionalProperties: false
    properties:
      org_id: { type: string }
      plugin:
        type: object
        additionalProperties: false
        properties:
          plugin_key: { type: string }
          version: { type: string }
          status: { type: string }
          updated_at:
            anyOf:
              - type: "null"
              - type: string
                format: date-time
        required: [plugin_key, version, status, updated_at]
      request_id: { type: string }
    required: [org_id, plugin, request_id]
  IntegrationsListResponse:
    type: object
    additionalProperties: false
    properties:
      org_id: { type: string }
      connectors:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            connector_key: { type: string }
            name: { type: string }
            category: { type: string }
            supports_webhook: { type: boolean }
