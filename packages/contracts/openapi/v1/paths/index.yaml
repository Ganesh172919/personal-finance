        application/json:
          schema:
            $ref: "../components/index.yaml#/schemas/CreateExportRequest"
    responses:
      "200":
        description: Existing export returned (idempotency hit).
        content:
          application/json:
            schema:
              $ref: "../components/index.yaml#/schemas/CreateExportResponse"
      "201":
        description: Export job created.
        content:
          application/json:
            schema:
              $ref: "../components/index.yaml#/schemas/CreateExportResponse"
      "400":
        $ref: "../components/index.yaml#/responses/BadRequest"
      "401":
        $ref: "../components/index.yaml#/responses/Unauthorized"
      "402":
        $ref: "../components/index.yaml#/responses/PaymentRequired"
      "403":
        $ref: "../components/index.yaml#/responses/Forbidden"
