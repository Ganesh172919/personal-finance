    operationId: listAuditEvents
    security:
      - CookieAuth: []
    parameters:
      - $ref: "../components/index.yaml#/parameters/XOrgId"
      - name: action
        in: query
        required: false
        schema:
          type: string
          maxLength: 80
      - name: limit
        in: query
        required: false
        schema:
          type: integer
