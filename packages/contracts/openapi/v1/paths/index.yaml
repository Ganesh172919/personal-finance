        content:
          application/json:
            schema:
              $ref: "../components/index.yaml#/schemas/ReferralRedeemResponse"
      "400":
        $ref: "../components/index.yaml#/responses/BadRequest"
      "401":
        $ref: "../components/index.yaml#/responses/Unauthorized"
      "403":
