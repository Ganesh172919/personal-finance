/api/v1/plugins/{id}/update:
  post:
    summary: Update installed plugin version
    operationId: updateInstalledPluginVersion
    security:
      - CookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-z0-9][a-z0-9._:-]{1,118}[a-z0-9]$"
      - $ref: "../components/index.yaml#/parameters/XOrgId"
      - $ref: "../components/index.yaml#/parameters/XCsrfToken"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/index.yaml#/schemas/PluginVersionUpdateRequest"
    responses:
      "200":
        description: Plugin updated.
        content:
          application/json:
            schema:
              $ref: "../components/index.yaml#/schemas/PluginOperationResponse"
      "400":
        $ref: "../components/index.yaml#/responses/BadRequest"
      "401":
        $ref: "../components/index.yaml#/responses/Unauthorized"
      "403":
        $ref: "../components/index.yaml#/responses/Forbidden"
      "404":
        $ref: "../components/index.yaml#/responses/NotFound"
/api/v1/plugins/{id}/uninstall:
  post:
    summary: Disable an installed plugin
    operationId: uninstallPlugin
    security:
      - CookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-z0-9][a-z0-9._:-]{1,118}[a-z0-9]$"
      - $ref: "../components/index.yaml#/parameters/XOrgId"
      - $ref: "../components/index.yaml#/parameters/XCsrfToken"
    responses:
      "200":
        description: Plugin disabled.
        content:
          application/json:
            schema:
              $ref: "../components/index.yaml#/schemas/PluginOperationResponse"
      "401":
