    operationId: downloadExport
    security:
      - CookieAuth: []
    parameters:
      - $ref: "../components/index.yaml#/parameters/ObjectIdPath"
      - $ref: "../components/index.yaml#/parameters/XOrgId"
    responses:
      "200":
        description: Export file download.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      "400":
        $ref: "../components/index.yaml#/responses/BadRequest"
      "401":
        $ref: "../components/index.yaml#/responses/Unauthorized"
      "403":
        $ref: "../components/index.yaml#/responses/Forbidden"
      "404":
        $ref: "../components/index.yaml#/responses/NotFound"
      "409":
        $ref: "../components/index.yaml#/responses/Conflict"
/api/v1/audit/events:
  get:
