    operationId: getExportById
    security:
      - CookieAuth: []
    parameters:
      - $ref: "../components/index.yaml#/parameters/ObjectIdPath"
      - $ref: "../components/index.yaml#/parameters/XOrgId"
    responses:
      "200":
        description: Export job.
        content:
          application/json:
            schema:
              $ref: "../components/index.yaml#/schemas/GetExportResponse"
      "400":
        $ref: "../components/index.yaml#/responses/BadRequest"
      "401":
        $ref: "../components/index.yaml#/responses/Unauthorized"
      "403":
        $ref: "../components/index.yaml#/responses/Forbidden"
      "404":
