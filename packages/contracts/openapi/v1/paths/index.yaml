/api/v1/orgs/me:
  get:
    summary: List my organizations
    operationId: orgsMe
    security:
      - CookieAuth: []
    parameters:
      - $ref: "../components/index.yaml#/parameters/XOrgId"
    responses:
      "200":
        description: Organizations visible to the current user.
        content:
          application/json:
            schema:
              $ref: "../components/index.yaml#/schemas/OrgsMeResponse"
      "401":
        $ref: "../components/index.yaml#/responses/Unauthorized"
/api/v1/orgs:
  post:
    summary: Create an organization
    operationId: createOrg
    security:
      - CookieAuth: []
    parameters:
      - $ref: "../components/index.yaml#/parameters/XCsrfToken"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/index.yaml#/schemas/CreateOrgRequest"
    responses:
      "201":
        description: Organization created.
        content:
          application/json:
            schema:
              $ref: "../components/index.yaml#/schemas/CreateOrgResponse"
      "400":
        $ref: "../components/index.yaml#/responses/BadRequest"
      "401":
        $ref: "../components/index.yaml#/responses/Unauthorized"
      "402":
        $ref: "../components/index.yaml#/responses/PaymentRequired"
      "409":
        $ref: "../components/index.yaml#/responses/Conflict"
/api/v1/orgs/{orgId}/members:
  post:
    summary: Add a member to an organization
    operationId: addOrgMember
    security:
      - CookieAuth: []
    parameters:
      - $ref: "../components/index.yaml#/parameters/OrgIdPath"
      - $ref: "../components/index.yaml#/parameters/XCsrfToken"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/index.yaml#/schemas/AddOrgMemberRequest"
    responses:
      "201":
        description: Member added.
        content:
          application/json:
            schema:
              $ref: "../components/index.yaml#/schemas/AddOrgMemberResponse"
      "400":
        $ref: "../components/index.yaml#/responses/BadRequest"
      "401":
        $ref: "../components/index.yaml#/responses/Unauthorized"
      "402":
        $ref: "../components/index.yaml#/responses/PaymentRequired"
      "403":
        $ref: "../components/index.yaml#/responses/Forbidden"
      "404":
        $ref: "../components/index.yaml#/responses/NotFound"
      "409":
        $ref: "../components/index.yaml#/responses/Conflict"
/api/v1/api-keys:
  get:
    summary: List API keys for the active org
    operationId: listApiKeys
    security:
      - CookieAuth: []
    parameters:
      - $ref: "../components/index.yaml#/parameters/XOrgId"
    responses:
      "200":
        description: API keys.
        content:
          application/json:
            schema:
              $ref: "../components/index.yaml#/schemas/ListApiKeysResponse"
      "401":
        $ref: "../components/index.yaml#/responses/Unauthorized"
      "403":
        $ref: "../components/index.yaml#/responses/Forbidden"
  post:
    summary: Create an API key for the active org
    operationId: createApiKey
    security:
      - CookieAuth: []
    parameters:
      - $ref: "../components/index.yaml#/parameters/XOrgId"
      - $ref: "../components/index.yaml#/parameters/XCsrfToken"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/index.yaml#/schemas/CreateApiKeyRequest"
    responses:
      "201":
        description: API key created.
        content:
          application/json:
            schema:
              $ref: "../components/index.yaml#/schemas/CreateApiKeyResponse"
      "401":
        $ref: "../components/index.yaml#/responses/Unauthorized"
      "403":
        $ref: "../components/index.yaml#/responses/Forbidden"
/api/v1/api-keys/{id}/revoke:
  post:
    summary: Revoke an API key
    operationId: revokeApiKey
    security:
      - CookieAuth: []
    parameters:
      - $ref: "../components/index.yaml#/parameters/ObjectIdPath"
      - $ref: "../components/index.yaml#/parameters/XOrgId"
      - $ref: "../components/index.yaml#/parameters/XCsrfToken"
    responses:
      "200":
        description: Key revoked.
        content:
          application/json:
            schema:
              $ref: "../components/index.yaml#/schemas/RevokeApiKeyResponse"
      "401":
        $ref: "../components/index.yaml#/responses/Unauthorized"
      "403":
        $ref: "../components/index.yaml#/responses/Forbidden"
      "404":
        $ref: "../components/index.yaml#/responses/NotFound"
/api/v1/usage/ledger:
  get:
    summary: Read usage ledger for the active org
    operationId: usageLedger
    security:
      - CookieAuth: []
      - ApiKeyAuth: []
    parameters:
      - $ref: "../components/index.yaml#/parameters/XOrgId"
      - name: period_key
        in: query
        required: false
        schema:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
        description: Billing period key (YYYY-MM). Defaults to current period.
    responses:
      "200":
        description: Usage, limits, and ledger rows.
        content:
          application/json:
            schema:
              $ref: "../components/index.yaml#/schemas/UsageLedgerResponse"
      "401":
        $ref: "../components/index.yaml#/responses/Unauthorized"
      "403":
        $ref: "../components/index.yaml#/responses/Forbidden"
/api/v1/billing/checkout:
  post:
    summary: Create a billing checkout session (Stripe) or activate plan (stub)
    operationId: billingCheckout
    security:
      - CookieAuth: []
    parameters:
      - $ref: "../components/index.yaml#/parameters/XOrgId"
      - $ref: "../components/index.yaml#/parameters/XCsrfToken"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/index.yaml#/schemas/BillingCheckoutRequest"
    responses:
      "200":
        description: Checkout session created or plan activated.
        content:
          application/json:
            schema:
              $ref: "../components/index.yaml#/schemas/BillingCheckoutResponse"
      "401":
        $ref: "../components/index.yaml#/responses/Unauthorized"
      "403":
        $ref: "../components/index.yaml#/responses/Forbidden"
/api/v1/billing/portal:
  get:
    summary: Create a billing portal session (Stripe) or return an app link (stub)
    operationId: billingPortal
    security:
      - CookieAuth: []
    parameters:
      - $ref: "../components/index.yaml#/parameters/XOrgId"
      - name: return_url
        in: query
        required: false
        schema:
          type: string
          format: uri
    responses:
      "200":
        description: Billing portal response.
        content:
          application/json:
            schema:
              $ref: "../components/index.yaml#/schemas/BillingPortalResponse"
      "401":
        $ref: "../components/index.yaml#/responses/Unauthorized"
      "403":
        $ref: "../components/index.yaml#/responses/Forbidden"
/api/v1/billing/webhook:
  post:
    summary: Stripe webhook (server-to-server)
    operationId: stripeWebhook
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
    parameters:
      - name: stripe-signature
        in: header
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Webhook received.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                received:
                  type: boolean
                request_id:
                  type: string
              required: [received, request_id]
/api/v1/workflows:
  get:
    summary: List workflows for the active org
    operationId: listWorkflows
    security:
      - CookieAuth: []
    parameters:
      - $ref: "../components/index.yaml#/parameters/XOrgId"
    responses:
      "200":
        description: Workflows.
        content:
          application/json:
            schema:
              $ref: "../components/index.yaml#/schemas/ListWorkflowsResponse"
      "401":
        $ref: "../components/index.yaml#/responses/Unauthorized"
      "403":
        $ref: "../components/index.yaml#/responses/Forbidden"
  post:
    summary: Create a workflow for the active org
    operationId: createWorkflow
    security:
      - CookieAuth: []
    parameters:
      - $ref: "../components/index.yaml#/parameters/XOrgId"
      - $ref: "../components/index.yaml#/parameters/XCsrfToken"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/index.yaml#/schemas/CreateWorkflowRequest"
    responses:
      "201":
        description: Workflow created.
        content:
          application/json:
            schema:
              $ref: "../components/index.yaml#/schemas/CreateWorkflowResponse"
      "401":
