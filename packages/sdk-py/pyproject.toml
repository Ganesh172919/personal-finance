[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finwise-sdk"
version = "0.1.0"
description = "FinWise API Python SDK (generated from OpenAPI)"
requires-python = ">=3.11"
dependencies = [
  "attrs>=22.2.0",
  "httpx>=0.24,<0.29",
  "python-dateutil>=2.8.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["finwise_sdk*"]

