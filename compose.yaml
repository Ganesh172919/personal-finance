services:
  web:
    build: ./client
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  server:
    build: ./server
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      PYTHON_API_URL: http://ai-core:8001
      AI_CORE_INTERNAL_TOKEN: ${AI_CORE_INTERNAL_TOKEN:?Set a shared AI_CORE_INTERNAL_TOKEN in the root .env}
      TRUST_PROXY: "1"
    depends_on:
      ai-core:
        condition: service_healthy
    restart: unless-stopped

  ai-core:
    build: ./server/AI_Core
    env_file: ./server/AI_Core/.env
    environment:
      AI_CORE_INTERNAL_TOKEN: ${AI_CORE_INTERNAL_TOKEN:?Set a shared AI_CORE_INTERNAL_TOKEN in the root .env}
      LLM_PROVIDER: gemini
      LLM_MODEL: gemini-3.5-flash-lite
      FINWISE_MEMORY_DB_PATH: /app/data/memory.sqlite3
    volumes:
      - ai-memory:/app/data
    restart: unless-stopped

volumes:
  ai-memory:
