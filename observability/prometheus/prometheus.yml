global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: finwise-server
    metrics_path: /api/metrics
    bearer_token: dev-metrics-token
    static_configs:
      - targets:
          - server:3000

  - job_name: finwise-ai-core
    metrics_path: /metrics
    bearer_token: dev-metrics-token
    static_configs:
      - targets:
          - ai-core:8001

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121

