services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-core:
    build:
      context: ./server/AI_Core
    restart: unless-stopped
    env_file:
      - ./server/AI_Core/.env
    environment:
      FINWISE_SERVER_URL: http://server:3000
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      ai-core:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      PYTHON_API_URL: http://ai-core:8001
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: "1"
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: "none"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      ai-core:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PYTHON_API_URL: http://ai-core:8001
      REDIS_URL: redis://redis:6379
      WORKER_ENABLED: "true"
      TRUST_PROXY: "1"
    command: ["node", "dist/worker.js"]

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  redis_data:
