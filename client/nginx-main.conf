# Top-level nginx.conf for the FinWise web image (replaces /etc/nginx/nginx.conf).
# Derived from the stock nginx:1.28-alpine file with higher connection limits:
# about 225 concurrent SSE streams plus regular traffic need well over the
# default 1024 worker_connections, and every proxied request uses two
# connections (client side + upstream side).

user  nginx;
worker_processes  auto;
# Must exceed worker_connections * 2 (client + upstream sockets).
worker_rlimit_nofile  16384;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The access log format is defined in conf.d/default.conf (finwise).
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    include /etc/nginx/conf.d/*.conf;
}
