services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-core:
    build:
      context: ./server/AI_Core
    restart: unless-stopped
    env_file:
      - ./server/AI_Core/.env
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      ai-core:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/finwise
      PYTHON_API_URL: http://ai-core:8001
      CLIENT_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:8080
      TRUST_PROXY: "1"
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: "lax"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/test').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 10

  client:
    build:
      context: ./client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
