# ══════════════════════════════════════════════════════════════════════
# FinWise — Test Pipeline
# ══════════════════════════════════════════════════════════════════════
# Runs on every push and pull request to main/develop branches.
# Tests all three tiers: client, server, AI Core.
# ══════════════════════════════════════════════════════════════════════

name: Tests

on:
  push:
    branches: [main, develop, features/*]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Client Tests ────────────────────────────────────────────────────
  client-tests:
    name: Client Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          CI: true

      - name: Build client
        run: npm run build

  # ── Server Tests ────────────────────────────────────────────────────
  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci
        env:
          CI: true
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci
          MONGO_URI: mongodb://localhost:27017/finwise-test
          REDIS_URL: redis://localhost:6379

      - name: Build server and worker
        run: npm run build

  # ── AI Core Tests ───────────────────────────────────────────────────
  ai-core-tests:
    name: AI Core Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/AI_Core

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            server/AI_Core/requirements.txt
            server/AI_Core/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short -m "not latency"
        env:
          CI: true
          LLM_PROVIDER: ""

      # The runner emits a baseline-comparable JSON report as well as pytest's
      # JUnit XML for individual cases.
      - name: Run evals
        run: python -m evals.runner -m "not latency" --tb=short --junitxml=eval-report.xml
        env:
          CI: true
          LLM_PROVIDER: ""

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-core-eval-report
          path: |
            server/AI_Core/eval-report.xml
            docs/records/evaluations/*.json
          if-no-files-found: warn
          retention-days: 14

  # ── Docker image builds (build only, no push) ───────────────────────
  # Catches Dockerfile / nginx.conf / lockfile drift before a deploy does.
  docker-build:
    name: Docker Build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            context: client
          - image: server
            context: server
          - image: ai-core
            context: server/AI_Core
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # ── Compose smoke test (k6 gate) ────────────────────────────────────
  # Brings up the real stack with the mock LLM and runs a 30s k6 smoke against
  # the nginx edge. Gate = k6 thresholds (see loadtest/k6/smoke.js).
  compose-smoke:
    name: Compose Smoke (k6)
    runs-on: ubuntu-latest
    needs: [server-tests, ai-core-tests]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Create env files and throwaway secrets
        run: |
          cp server/.env.example server/.env
          cp server/AI_Core/.env.example server/AI_Core/.env
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "AI_CORE_INTERNAL_TOKEN=$(openssl rand -hex 24)"
            echo "WEBHOOK_CREDENTIALS_KEY=$(openssl rand -base64 32)"
            echo "LLM_PROVIDER=mock"
          } >> "$GITHUB_ENV"

      - name: Start stack (mock LLM)
        run: |
          docker compose -f compose.yaml -f loadtest/compose.loadtest.yaml up -d --build --wait --wait-timeout 300

      - name: Verify headers on a direct SPA route
        run: |
          headers=$(curl --fail --silent --show-error --dump-header - --output /dev/null http://127.0.0.1:8080/chat/local)
          printf '%s\n' "$headers" | tr -d '\r' | grep -ix 'x-frame-options: DENY'
          printf '%s\n' "$headers" | tr -d '\r' | grep -ix 'referrer-policy: strict-origin-when-cross-origin'

      - uses: grafana/setup-k6-action@v1

      - name: k6 smoke
        run: k6 run loadtest/k6/smoke.js
        env:
          K6_BASE_URL: http://127.0.0.1:8080

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f loadtest/compose.loadtest.yaml logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml -f loadtest/compose.loadtest.yaml down -v

  # ── Lint ────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Lint client
        run: cd client && npm run lint

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Type check server
        run: cd server && npx tsc --noEmit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint AI Core
        run: cd server/AI_Core && pip install ruff==0.7.4 && ruff check .
