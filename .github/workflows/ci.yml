name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Server ─────────────────────────────────────────────
  server-check:
    name: Server — Typecheck + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Typecheck
        working-directory: server
        run: npm run check

      - name: Run tests
        working-directory: server
        run: npm run test:ci

  # ─── Client ─────────────────────────────────────────────
  client-check:
    name: Client — Typecheck + Lint + Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Typecheck
        working-directory: client
        run: npx tsc --noEmit

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Run tests
        working-directory: client
        run: npm test

  # ─── Contract drift ────────────────────────────────────
  openapi-contract:
    name: OpenAPI Contract — Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [server-check]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Regenerate OpenAPI paths
        working-directory: server
        run: npm run generate:openapi

      - name: Check for uncommitted contract drift
        run: |
          if git diff --exit-code packages/contracts/openapi/v1/paths/index.yaml; then
            echo "✅ OpenAPI contract is up to date"
          else
            echo "❌ OpenAPI contract has drifted! Run 'npm run generate:openapi' in server/ and commit."
            exit 1
          fi
