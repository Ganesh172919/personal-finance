name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  provider-policy:
    name: Provider Policy (Gemini-only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure no OpenAI references
        run: |
          if grep -R -nEi \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=.venv \
            --exclude-dir=.pytest_cache \
            --exclude-dir=.ruff_cache \
            --exclude-dir=__pycache__ \
            --exclude-dir=dist \
            --exclude=package-lock.json \
            --exclude=pnpm-lock.yaml \
            --exclude=yarn.lock \
            --exclude=poetry.lock \
            --exclude=.github/workflows/ci.yml \
            --exclude=scripts/quality-gate.ps1 \
            --exclude='*.log' \
            "(openai|OPENAI_)" .; then
            echo "Gemini-only provider policy failed."
            exit 1
          fi

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  server-check:
    name: Server Typecheck + Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Typecheck
        working-directory: server
        run: npm run check

      - name: Security Audit (Prod Dependencies)
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

      - name: Tests
        working-directory: server
        run: npm run test:ci

  client-check:
    name: Client Lint + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Security Audit (Prod Dependencies)
        working-directory: client
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        working-directory: client
        run: npm run build

  sdk-ts-check:
    name: TS SDK (OpenAPI) Generate + Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/sdk-ts/package-lock.json

      - name: Install dependencies
        working-directory: packages/sdk-ts
        run: npm ci

      - name: Generate SDK
        working-directory: packages/sdk-ts
        run: npm run generate

      - name: Typecheck
        working-directory: packages/sdk-ts
        run: npm run check

      - name: Ensure generated files are committed
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  ai-core-check:
    name: AI Core Tests + Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: server/AI_Core
        run: pip install -r requirements.txt

      - name: Ruff
        working-directory: server/AI_Core
        run: ruff check tests

      - name: Guard prompt logging patterns
        working-directory: server/AI_Core
        run: |
          if grep -R -nE "Processing request:|Explaining financial concept:" api_service.py agents; then
            echo "Sensitive prompt logging pattern detected."
            exit 1
          fi

      - name: Pytest
        working-directory: server/AI_Core
        run: pytest -q

  container-build:
    name: Container Build Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Server Image
        run: docker build -t finwise-server:ci ./server

      - name: Build AI Core Image
        run: docker build -t finwise-ai-core:ci ./server/AI_Core

      - name: Build Client Image
        run: docker build -t finwise-client:ci -f client/Dockerfile .
