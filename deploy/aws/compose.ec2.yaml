services:
  web:
    networks: [default, edge]

  caddy:
    image: caddy:2.11.9-alpine
    environment:
      FINWISE_HOST: ${FINWISE_HOST:?Set FINWISE_HOST in the root .env}
    ports:
      - "80:80"
      - "443:443"
    networks: [edge]
    volumes:
      - ./deploy/aws/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

networks:
  edge:

volumes:
  caddy-data:
  caddy-config:
